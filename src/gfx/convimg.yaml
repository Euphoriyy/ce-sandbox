palettes:
  - name: global_palette
    fixed-entries:
      - color: {index:   0, hex: "#000000"}
      - color: {index: 255, hex: "#ffffff"}
      - color: {index:   1, hex: "#eec39a"}
      - color: {index:   2, hex: "#ddb085"}
      - color: {index:   3, hex: "#1183e8"}
      - color: {index:   4, hex: "#1161df"}
      - color: {index:   5, hex: "#2957f0"}
      - color: {index:   6, hex: "#59362f"}
      - color: {index:   7, hex: "#53342e"}
      - color: {index:   8, hex: "#5b3730"}
      - color: {index:   9, hex: "#86959d"}
      - color: {index:  10, hex: "#767a7b"}
      - color: {index:  11, hex: "#6bf07c"}
      - color: {index:  12, hex: "#6bd07f"}
      - color: {index:  13, hex: "#62ce62"}
      - color: {index:  14, hex: "#6699CC"}
      - color: {index:  15, hex: "#709bc3"}
      - color: {index:  16, hex: "#573a15"}
      - color: {index:  17, hex: "#6c411b"}
      - color: {index:  56, hex: "#161079"}
      - color: {index:  57, hex: "#0f0875"}
    images: automatic

converts:
  - name: sprites
    palette: global_palette
    images:
      - title
      - brush_cursor
      - eraser_cursor
      - hand_cursor
      - pinching_cursor
      - background_*
  - name: rlet_sprites
    palette: global_palette
    style: rlet
    images:
      - brush_icon
      - eraser_icon
  - name: avatar
    palette: global_palette
    style: rlet
    images:
      - avatar*
  - name: flipped_avatar
    palette: global_palette
    style: rlet
    flip-y: true
    suffix: _flipped
    images:
      - avatar*

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - global_palette
    converts:
      - sprites
      - rlet_sprites
      - avatar
      - flipped_avatar
